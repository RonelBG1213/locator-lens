<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locator Lens</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #16223a;
        --muted: #5b6b85;
        --line: #dfe5ee;
        --panel: #f6f8fb;
        --accent: #2d7ff9;
        --strong: #16a34a;
        --fair: #ca8a04;
        --weak: #dc2626;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11161f;
          --fg: #e7edf6;
          --muted: #93a2ba;
          --line: #26303f;
          --panel: #182130;
          --accent: #5a9dff;
          --strong: #34d399;
          --fair: #fbbf24;
          --weak: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      }
      #app { display: flex; flex-direction: column; min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
